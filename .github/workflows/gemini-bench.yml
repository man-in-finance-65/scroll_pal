name: Gemini speed test

# Manual. Times how long Gemini takes to read real recipe Shorts with different settings, using the GEMINI_TOKEN secret.
# Costs a few cents. Results are in the run log. The key is never printed.
on:
  push:
    branches: [claude/gracious-keller-6lrp79]
    paths: [".github/workflows/gemini-bench.yml", "api/scripts/bench.ts"]
  workflow_dispatch:
    inputs:
      urls:
        description: "Comma-separated YouTube links (leave empty for the built-in two)"
        required: false
        default: ""

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_TOKEN }}
      BENCH_URLS: ${{ inputs.urls }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx tsx scripts/bench.ts
