name: Deploy Pal server

# Tests pal-server/ and deploys it to Cloud Run (service pal-server). Keys stay in Google Secret Manager;
# the service keeps them between deploys. Signs in to Google without a key file (workload identity), set up by
# scripts/connect-github.sh.
on:
  push:
    branches: [claude/relaxed-hypatia-vwaro9]
    paths: ["pal-server/**", ".github/workflows/pal-server.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: pal-server/package-lock.json }
      - run: npm ci && npx tsc --noEmit && npm test
        working-directory: pal-server
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud run deploy pal-server --project "${{ vars.GCP_PROJECT_ID }}" --source pal-server --region us-central1 --quiet
      - run: curl -fsS "${{ vars.PAL_API_URL }}/health"
